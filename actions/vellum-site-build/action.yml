name: 'Endjin.RecommendedPractices.Build.Vellum'
description: 'Runs the standardised build process for a Vellum-based static web app'
inputs:
  buildScriptPath:
    description: 'The path to the build script'
    required: true
    default: './build.ps1'
  githubVellumPat:
    description: 'The GitHub Personal Access Token for downloading Vellum CLI as a GitHub release asset'
    required: true

runs:
  using: "composite"
  steps:
  - name: Enable long paths
    run: git config --global core.longpaths true
    shell: bash
  - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

  # '.vellum/package-lock.json' is generated from the module's template during the build, so it
  # does not exist yet at this point. Key the cache on the template instead, which ships with
  # this action. hashFiles() only reads the workspace, so compute the hash directly.
  - name: Compute NPM cache key
    id: npm_cache_key
    shell: bash
    run: |
      lock_template="${{ github.action_path }}/../../module/templates/vite-package-lock.template.json"
      echo "hash=$(sha256sum "$lock_template" | cut -c1-16)" >> "$GITHUB_OUTPUT"

  - name: Get cached NPM modules
    id: cache_npm_dependencies
    uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9    # v6.1.0
    with:
      path: |
        .vellum/node_modules
      key: ${{ runner.os }}-npm-vite-${{ steps.npm_cache_key.outputs.hash }}
      restore-keys: |
        ${{ runner.os }}-npm-vite-

  - uses: endjin/Endjin.RecommendedPractices.GitHubActions/actions/run-scripted-build@main
    id: build
    with:
      netSdkVersion: '8.x'
      additionalNetSdkVersion: '9.x'
      tasks: '.'
    env:
      GH_TOKEN : ${{ inputs.githubVellumPat }}

  - name: Store generated web site
    id: cache_site
    uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9    # v6.1.0
    with:
      path: website.zip
      key: website-${{ github.sha }}